<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
  <defs>
    <linearGradient id="wgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E2E8"/>
      <stop offset="100%" stop-color="#6E6E78"/>
    </linearGradient>
    <linearGradient id="wg_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#664C05"/>
    </linearGradient>
  </defs>
  <g transform="translate(700, 700)">
    <!-- Case & Iced Bezel -->
    <circle cx="0" cy="0" r="420" fill="url(#wgrad)" stroke="url(#wg_gold)" stroke-width="28"/>
    <circle cx="0" cy="0" r="370" fill="#0C0C10"/>
    <!-- Hour Markers -->
    <line x1="0" y1="-330" x2="0" y2="-270" stroke="#D4AF37" stroke-width="12"/>
    <line x1="0" y1="270" x2="0" y2="330" stroke="#D4AF37" stroke-width="12"/>
    <line x1="-330" y1="0" x2="-270" y2="0" stroke="#D4AF37" stroke-width="12"/>
    <line x1="270" y1="0" x2="330" y2="0" stroke="#D4AF37" stroke-width="12"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="140" y2="-120" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-80" y2="160" stroke="#D4AF37" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="22" fill="#D4AF37"/>
    <text x="0" y="-120" font-family="sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">WE JEWELRY</text>
    <text x="0" y="100" font-family="monospace" font-size="18" fill="#D4AF37" text-anchor="middle" letter-spacing="4">AUTOMATIC VVS</text>
  </g>
</svg>
