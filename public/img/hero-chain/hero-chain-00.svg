<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs>
    <linearGradient id="gold_00" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="29.9%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#4A3405"/>
    </linearGradient>
    <filter id="glow_00" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g transform="translate(500, 750) rotate(-35) scale(0.937, 1) translate(-500, -750)">
    <!-- Heavy Miami Cuban Links Stacked in Perspective -->
    <g filter="url(#glow_00)">
      <ellipse cx="500" cy="280" rx="140" ry="65" fill="none" stroke="url(#gold_00)" stroke-width="48"/>
      <ellipse cx="500" cy="420" rx="140" ry="65" fill="none" stroke="url(#gold_00)" stroke-width="48"/>
      <ellipse cx="500" cy="560" rx="140" ry="65" fill="none" stroke="url(#gold_00)" stroke-width="48"/>
      <ellipse cx="500" cy="700" rx="140" ry="65" fill="none" stroke="url(#gold_00)" stroke-width="48"/>
      <ellipse cx="500" cy="840" rx="140" ry="65" fill="none" stroke="url(#gold_00)" stroke-width="48"/>
      <ellipse cx="500" cy="980" rx="140" ry="65" fill="none" stroke="url(#gold_00)" stroke-width="48"/>
      <ellipse cx="500" cy="1120" rx="140" ry="65" fill="none" stroke="url(#gold_00)" stroke-width="48"/>
    </g>
    <!-- Clasp Box with WE Hallmark -->
    <rect x="420" y="1180" width="160" height="100" rx="12" fill="url(#gold_00)" stroke="#FFF" stroke-width="4"/>
    <text x="500" y="1245" font-family="monospace" font-size="28" font-weight="bold" fill="#2A1B02" text-anchor="middle">WE 14K</text>
  </g>
</svg>
