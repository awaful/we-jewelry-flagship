<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="silver_f2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E2E8"/>
      <stop offset="70%" stop-color="#9E9EA8"/>
      <stop offset="100%" stop-color="#4A4A52"/>
    </linearGradient>
    <linearGradient id="gold_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7A5D08"/>
    </linearGradient>
    <filter id="shadow_f2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="rgba(0,0,0,0.38)"/>
    </filter>
  </defs>
  <g filter="url(#shadow_f2)">
    <!-- Bail -->
    <path d="M 360,100 L 440,100 L 420,240 L 380,240 Z" fill="url(#gold_accent)" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="400" cy="180" r="14" fill="#FFFFFF"/>
    <!-- Medallion Frame -->
    <circle cx="400" cy="580" r="300" fill="#0E0E12" stroke="url(#gold_accent)" stroke-width="36"/>
    <circle cx="400" cy="580" r="260" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="10,12"/>
    <!-- Sculpted Bust Relief -->
    <polygon points="400,380 500,480 470,680 330,680 300,480" fill="url(#silver_f2)"/>
    <circle cx="400" cy="520" r="55" fill="#FFFFFF" opacity="0.95"/>
    <text x="400" y="730" font-family="'Inter Tight', sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">WE LUMINOUS</text>
  </g>
</svg>
