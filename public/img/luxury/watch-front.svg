<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="silver_w4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D0D0D8"/>
      <stop offset="100%" stop-color="#555560"/>
    </linearGradient>
    <filter id="shadow_w4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="rgba(0,0,0,0.38)"/>
    </filter>
  </defs>
  <g filter="url(#shadow_w4)" transform="translate(400, 500)">
    <!-- Bracelet Straps -->
    <rect x="-90" y="-420" width="180" height="840" rx="14" fill="url(#silver_w4)"/>
    <line x1="-90" y1="-320" x2="90" y2="-320" stroke="#333" stroke-width="4"/>
    <line x1="-90" y1="320" x2="90" y2="320" stroke="#333" stroke-width="4"/>
    <!-- Octagonal Case & Bezel -->
    <circle cx="0" cy="0" r="260" fill="url(#silver_w4)" stroke="#D4AF37" stroke-width="24"/>
    <!-- Diamond Iced Bezel Ring -->
    <circle cx="0" cy="0" r="230" fill="#0C0C10" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="14,14"/>
    <!-- Dial -->
    <circle cx="0" cy="0" r="190" fill="#111116"/>
    <!-- Hour Markers -->
    <line x1="0" y1="-160" x2="0" y2="-120" stroke="#D4AF37" stroke-width="8"/>
    <line x1="0" y1="120" x2="0" y2="160" stroke="#D4AF37" stroke-width="8"/>
    <line x1="-160" y1="0" x2="-120" y2="0" stroke="#D4AF37" stroke-width="8"/>
    <line x1="120" y1="0" x2="160" y2="0" stroke="#D4AF37" stroke-width="8"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="75" y2="-65" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-45" y2="85" stroke="#D4AF37" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#D4AF37"/>
    <text x="0" y="-60" font-family="'Inter Tight', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">WE JEWELRY</text>
  </g>
</svg>
