<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="gold_r5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BA"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#5E4304"/>
    </linearGradient>
    <filter id="shadow_r5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="rgba(0,0,0,0.36)"/>
    </filter>
  </defs>
  <g filter="url(#shadow_r5)" transform="translate(400, 520)">
    <!-- Ring Band -->
    <circle cx="0" cy="80" r="220" fill="none" stroke="url(#gold_r5)" stroke-width="56"/>
    <!-- Top Signet Architecture -->
    <rect x="-140" y="-180" width="280" height="180" rx="12" fill="url(#gold_r5)" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Channel Baguette Diamonds -->
    <rect x="-110" y="-150" width="45" height="120" fill="#FFFFFF" stroke="#D0D0D8" stroke-width="3"/>
    <rect x="-50" y="-150" width="45" height="120" fill="#FFFFFF" stroke="#D0D0D8" stroke-width="3"/>
    <rect x="10" y="-150" width="45" height="120" fill="#FFFFFF" stroke="#D0D0D8" stroke-width="3"/>
    <rect x="70" y="-150" width="45" height="120" fill="#FFFFFF" stroke="#D0D0D8" stroke-width="3"/>
  </g>
</svg>
